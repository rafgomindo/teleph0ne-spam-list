name: Build spam list

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  pull_request:
    paths: ["data/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the data files
        if: github.event_name == 'pull_request'
        run: node scripts/build.mjs --check

      - name: Build and publish spam_list.csv
        if: github.event_name != 'pull_request'
        run: |
          node scripts/build.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add spam_list.csv
          git diff --cached --quiet || (git commit -m "Update spam list" && git push)
